name: Generate GitHub Trophy SVG

on:
  schedule:
    # Runs once a day at 00:00 UTC — adjust the cron if you want it more/less often
    - cron: "0 0 * * *"
  workflow_dispatch: # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-trophy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate trophy.svg
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: oyehimar-bot
          output_path: dist/trophy.svg
          theme: radical
          no-frame: "false"
          no-bg: "true"
          margin-w: "4"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push trophy.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          keep_history: true
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
